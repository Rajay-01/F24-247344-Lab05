<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sports shop — The seats</title>
</head>
<body>
<header style="background: purple;">
  <h1 style="color: white;">Sports shop</h1>
</header>

<main>
  <p id="status">Write a name and a count, then touch an empty seat.</p>
  <p>Free seats: <span id="free">8</span></p>
  <p>
    <label>Name <input id="who"></label>
    <label>Count <input id="many"></label>
  </p>
  <div id="hall">
    <button class="seat" id="seat-1" data-n="1"><span>1</span></button>
    <button class="seat" id="seat-2" data-n="2"><span>2</span></button>
    <button class="seat" id="seat-3" data-n="3"><span>3</span></button>
    <button class="seat" id="seat-4" data-n="4"><span>4</span></button>
    <button class="seat" id="seat-5" data-n="5"><span>5</span></button>
    <button class="seat" id="seat-6" data-n="6"><span>6</span></button>
    <button class="seat" id="seat-7" data-n="7"><span>7</span></button>
    <button class="seat" id="seat-8" data-n="8"><span>8</span></button>
  </div>
</main>
<footer>247344</footer>
</body>
</html>
